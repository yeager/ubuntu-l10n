[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "ubuntu-l10n"
version = "0.3.13"
description = "Ubuntu/Launchpad translation statistics viewer"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
]
authors = [
    { name = "Daniel Nylander", email = "daniel@danielnylander.se" },
]
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.28",
    "lxml>=4.9",
]

[project.scripts]
ubuntu-l10n = "ubuntu_l10n.app:main"

[project.urls]
Homepage = "https://github.com/yeager/ubuntu-l10n"
Repository = "https://github.com/yeager/ubuntu-l10n"

[tool.setuptools.packages.find]
include = ["ubuntu_l10n*"]

[tool.setuptools.package-data]
ubuntu_l10n = ["locale/*/LC_MESSAGES/*.mo"]

[tool.setuptools.exclude-package-data]
"*" = ["*.bak"]
