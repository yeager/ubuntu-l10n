name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install GTK test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-requests python3-bs4 python3-lxml \
            gir1.2-gtk-4.0 gir1.2-adw-1 xvfb
      - name: Test accessibility controls
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -p 'test_accessibility.py' -v

  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q ubuntu_l10n tests

  deb-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream build-essential gettext dpkg-dev debhelper dh-python \
            python3-build python3-setuptools-scm \
            python3-all python3-setuptools pybuild-plugin-pyproject
      - name: Compile translations
        run: python3 scripts/compile-translations.py
      - name: Generate translated desktop entry
        run: python3 desktop-merge.py se.danielnylander.ubuntu-l10n.desktop.in po/ se.danielnylander.ubuntu-l10n.desktop
      - name: Build and inspect Debian package
        run: |
          set -euo pipefail
          appstreamcli validate data/se.danielnylander.ubuntu-l10n.metainfo.xml
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          bash scripts/build-deb.sh build/test-package "$VERSION"
          PACKAGE="build/test-package/ubuntu-l10n_${VERSION}-1_all.deb"
          test "$(dpkg-deb --field "$PACKAGE" Architecture)" = all
          test "$(dpkg-deb --field "$PACKAGE" Version)" = "${VERSION}-1"
          CONTENTS=$(dpkg-deb --contents "$PACKAGE")
          grep -Fq './usr/bin/ubuntu-l10n' <<<"$CONTENTS"
          grep -Fq './usr/share/applications/se.danielnylander.ubuntu-l10n.desktop' <<<"$CONTENTS"
          grep -Fq './usr/share/metainfo/se.danielnylander.ubuntu-l10n.metainfo.xml' <<<"$CONTENTS"
          grep -Fq './usr/share/icons/hicolor/scalable/apps/ubuntu-l10n.svg' <<<"$CONTENTS"
          grep -Fq './usr/share/locale/sv/LC_MESSAGES/ubuntu-l10n.mo' <<<"$CONTENTS"
          grep -Fq './usr/lib/python3/dist-packages/ubuntu_l10n/system_language.py' <<<"$CONTENTS"
          DEPENDS=$(dpkg-deb --field "$PACKAGE" Depends)
          for dependency in python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 python3-bs4 python3-requests python3-lxml; do
            grep -Fq "$dependency" <<<"$DEPENDS"
          done
      - name: Build Debian package from debian/ metadata
        run: |
          set -euo pipefail
          dpkg-buildpackage -us -uc -b
          PACKAGE=$(find .. -maxdepth 1 -type f -name 'ubuntu-l10n_*_all.deb' -print -quit)
          test -n "$PACKAGE"
          dpkg-deb --contents "$PACKAGE" | grep -Fq 'ubuntu_l10n/locale/sv/LC_MESSAGES/ubuntu-l10n.mo'
          dpkg-deb --contents "$PACKAGE" | grep -Fq 'usr/share/metainfo/se.danielnylander.ubuntu-l10n.metainfo.xml'
