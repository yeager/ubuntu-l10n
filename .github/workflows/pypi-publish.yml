name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release tag matches project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project_version = project["project"]["version"]
          assert tag_version == project_version, (tag_version, project_version)
          PY
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          python -m pip install --upgrade build twine
          python -m pip install .
      - name: Compile translations
        run: python scripts/compile-translations.py
      - name: Run release sanity tests
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile

          wheel, = Path("dist").glob("*.whl")
          sdist, = Path("dist").glob("*.tar.gz")
          wheel_catalogue = "ubuntu_l10n/locale/sv/LC_MESSAGES/ubuntu-l10n.mo"
          package_modules = (
              "ubuntu_l10n/system_language.py",
              "ubuntu_l10n/selection_state.py",
          )
          metainfo_name = "se.danielnylander.ubuntu-l10n.metainfo.xml"
          with ZipFile(wheel) as archive:
              assert wheel_catalogue in archive.namelist(), "Swedish catalogue missing from wheel"
              for module in package_modules:
                  assert module in archive.namelist(), f"{module} missing from wheel"
          with open_tar(sdist, "r:gz") as archive:
              assert any(member.name.endswith("/" + wheel_catalogue) for member in archive.getmembers()), \
                  "Swedish catalogue missing from source distribution"
              for module in package_modules:
                  assert any(member.name.endswith("/" + module) for member in archive.getmembers()), \
                      f"{module} missing from source distribution"
              assert any(member.name.endswith("/data/" + metainfo_name) for member in archive.getmembers()), \
                  "AppStream metadata missing from source distribution"
          PY
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
