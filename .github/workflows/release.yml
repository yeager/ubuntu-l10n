name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Install tools
        run: sudo apt-get install -y gettext

      - name: Compile translations
        run: |
          set -euo pipefail
          for po in po/*.po; do
            [ -f "$po" ] || continue
            lang=$(basename "$po" .po)
            mkdir -p "locale/$lang/LC_MESSAGES"
            msgfmt -o "locale/$lang/LC_MESSAGES/ubuntu-l10n.mo" "$po"
          done

      - name: Generate translated .desktop file
        run: |
          python3 desktop-merge.py se.danielnylander.ubuntu-l10n.desktop.in po/ se.danielnylander.ubuntu-l10n.desktop

      - name: Build .deb
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/build-deb.sh build/release "$VERSION"

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "build/release/ubuntu-l10n_${VERSION}-1_all.deb" \
            --title "v${VERSION}" \
            --notes "Release v${VERSION} with checked-in translations" \
            --repo yeager/ubuntu-l10n
