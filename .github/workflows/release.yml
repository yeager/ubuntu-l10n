name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Install tools
        run: sudo apt-get install -y appstream gettext

      - name: Compile translations
        run: |
          msgcmp po/sv.po po/ubuntu-l10n.pot
          python3 scripts/compile-translations.py

      - name: Generate translated .desktop file
        run: |
          python3 desktop-merge.py se.danielnylander.ubuntu-l10n.desktop.in po/ se.danielnylander.ubuntu-l10n.desktop

      - name: Validate AppStream metadata
        run: appstreamcli validate data/se.danielnylander.ubuntu-l10n.metainfo.xml

      - name: Build .deb
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/build-deb.sh build/release "$VERSION"
          dpkg-deb --contents "build/release/ubuntu-l10n_${VERSION}-1_all.deb" | \
            grep -Fq 'usr/share/metainfo/se.danielnylander.ubuntu-l10n.metainfo.xml'

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "build/release/ubuntu-l10n_${VERSION}-1_all.deb" \
            --title "v${VERSION}" \
            --notes "Release v${VERSION} with checked-in translations" \
            --repo yeager/ubuntu-l10n
